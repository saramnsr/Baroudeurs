parameters:
    locale: en

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $projectDir: '%kernel.project_dir%'
            # Clés lues dans .env.local (jamais dans le code)
            string $cloudinaryUrl: '%env(CLOUDINARY_URL)%'
            string $deeplApiKey: '%env(DEEPL_API_KEY)%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # Traduction : DeepL (pour changer de fournisseur, changer uniquement cette ligne)
    App\Service\Translation\ContentTranslatorInterface: '@App\Service\Translation\DeepLTranslator'

    # CDN pour les assets locaux (CSS, JS, fonts, images) — utilisé en production
    # quand le dossier public/assets n'est pas présent sur le serveur.
    # Le préfixe est configurable via ASSET_CDN_BASE dans .env
    App\Twig\CdnAssetExtension:
        arguments:
            $cdnBase: '%env(ASSET_CDN_BASE)%'