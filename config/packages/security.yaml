security:
    # Hachage des mots de passe admin (bcrypt / argon2 automatique)
    encoders:
        App\Entity\Admin\User:
            algorithm: auto

    # Les admins sont chargés depuis la base, par email
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Admin\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            anonymous: lazy
            provider: app_user_provider

    access_control:
        # Complété à l'étape 2