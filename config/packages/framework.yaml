framework:
  secret: '%env(APP_SECRET)%'
  # Protection CSRF (formulaire de connexion, déconnexion)
  csrf_protection: true
  default_locale: en

  translator:
    default_path: '%kernel.project_dir%/translations'
    fallbacks:
      - en

  session:
    handler_id: null
    cookie_secure: auto
    cookie_samesite: lax
    cookie_httponly: true

  php_errors:
    log: true