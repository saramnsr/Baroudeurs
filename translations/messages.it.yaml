about_page:
  title: "Chi Siamo"
  breadcrumb_home: "Home"
  intro: "Scopri la storia dietro Les Baroudeurs du Désert"
  presentation_title: "La Nostra Storia"
  presentation_text: "Les Baroudeurs du Désert è nato da una passione comune per gli spazi aperti e le tradizioni della Tunisia meridionale. Quello che è iniziato come un piccolo gruppo di amici che condividevano il loro amore per il deserto è diventato un team di professionisti dedicati, impegnati a condividere la bellezza e la cultura della Tunisia con viaggiatori da tutto il mondo."
  mission_title: "La Nostra Missione"
  mission_text: "Offrire esperienze autentiche e responsabili nel deserto che collegano i viaggiatori con il vero spirito della Tunisia. Crediamo in un viaggio che rispetta le comunità locali, preserva l'ambiente e crea ricordi duraturi."
  
  team_title: "Incontra il Nostro Team"
  team_subtitle: "Le persone appassionate dietro la tua avventura nel deserto"
  
  team:
    member1:
      name: "Ahmed Ben Ali"
      role: "Fondatore & Guida del Deserto"
      description: "Nato e cresciuto a Douz, Ahmed esplora il Sahara da oltre 20 anni. La sua profonda conoscenza del deserto e la sua passione nel condividerla con gli altri sono il cuore di Les Baroudeurs du Désert."
    member2:
      name: "Mohamed El Khadra"
      role: "Guida Senior"
      description: "Con 15 anni di esperienza, Mohamed conosce ogni duna e oasi del Sahara tunisino. La sua calma e le sue capacità di narratore rendono ogni viaggio indimenticabile."
    member3:
      name: "Laila Ben Amor"
      role: "Guida Culturale"
      description: "Laila dà vita alle tradizioni della Tunisia. La sua conoscenza della cultura berbera, della cucina locale e dell'artigianato tradizionale aggiunge una dimensione unica a ogni tour."
    member4:
      name: "Karim El Mansour"
      role: "Autista 4x4 & Meccanico"
      description: "L'esperienza di Karim al volante e le sue competenze meccaniche garantiscono viaggi sicuri e confortevoli attraverso le piste desertiche più remote."
  
  values_title: "I Nostri Valori"
  values_subtitle: "I principi che guidano tutto ciò che facciamo"
  
  values:
    authenticity:
      title: "Autenticità"
      description: "Offriamo esperienze autentiche che riflettono la vera cultura e lo spirito della Tunisia. Niente trappole per turisti, solo vere connessioni con persone e luoghi."
    safety:
      title: "Sicurezza"
      description: "La tua sicurezza è la nostra priorità. Le nostre guide sono professionisti addestrati, i nostri veicoli sono ben mantenuti e seguiamo rigorosi protocolli di sicurezza in ogni tour."
    respect:
      title: "Rispetto per le Comunità Locali"
      description: "Lavoriamo a stretto contatto con le comunità locali, assicurando che il turismo porti benefici alle persone che vivono nel deserto. Rispettiamo le loro tradizioni e il loro stile di vita."
    sustainability:
      title: "Turismo Responsabile"
      description: "Ci impegniamo a proteggere il fragile ecosistema del deserto. Riduciamo al minimo il nostro impatto ambientale, sosteniamo gli sforzi di conservazione e promuoviamo pratiche di viaggio sostenibili."
  
  responsible_title: "Il Nostro Approccio al Turismo Responsabile"
  responsible_text: "A Les Baroudeurs du Désert, crediamo che il viaggio debba fare del bene. Il nostro approccio al turismo responsabile include:"
  responsible_items:
    item1: "Lavorare con guide e autisti locali"
    item2: "Sostenere le imprese e gli artigiani locali"
    item3: "Ridurre al minimo i rifiuti e l'impatto ambientale"
    item4: "Rispettare la fauna selvatica e gli habitat naturali"
    item5: "Promuovere lo scambio culturale e la comprensione"
    item6: "Restituire alle comunità locali"
  
  gallery_title: "La Nostra Galleria"
  gallery_subtitle: "Momenti delle nostre avventure nel deserto"
  
  cta_title: "Pronto a Esplorare il Deserto?"
  cta_text: "Unisciti a noi per un'avventura indimenticabile nel Sahara tunisino"
  cta_button: "Prenota la Tua Avventura"
blog_page:
  title: "Il Nostro Blog"
  breadcrumb_home: "Home"
  subtitle: "Consigli, Guide e Storie dal Sahara"
  posted_by: "Pubblicato da"
  view_circuits: "Vedi i Nostri Circuiti"
  article1:
    title: "Preparare lo zaino per il deserto"
    excerpt: "Prepara lo zaino in modo intelligente! I nostri bivacchi forniscono tutti i pasti (pane di sabbia, formaggio, marmellata, tè, chorba, couscous). Ti servono solo vestiti caldi per le notti fredde, un costume per le sorgenti di Ksar Ghilane, scarpe comode, crema solare e una torcia."
  article2:
    title: "Cosa vedere a Ksar Ghilane?"
    excerpt: "Scopri l'oasi più meridionale della Tunisia, situata ai margini del Grande Erg Orientale. Fai un bagno nella sua sorgente termale naturale circondata da palme, esplora le rovine romane e goditi giri in quad o a dorso di dromedario (opzionale)!"
  article3:
    title: "Le nostre ricette preferite al bivacco"
    excerpt: "Vivi la vera cucina beduina! Guarda le nostre guide cuocere il 'Pane di Sabbia' sotto il fuoco e goditi cene tradizionali di chorba, couscous e frutta di stagione sotto le stelle."


