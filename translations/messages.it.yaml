about_page:
  hero_label: "Chi Siamo"
  title: "Chi Siamo"
  breadcrumb_home: "Home"

  # Hero
  hero_title: "Chi Siamo"
  hero_subtitle: "Più di un viaggio, un'avventura da vivere."
  hero_text: "Baroudeurs du Désert ti invita a scoprire paesaggi autentici, orizzonti infiniti ed esperienze indimenticabili nel cuore del deserto."
  hero_button: "Scopri le nostre avventure"

  # La nostra storia
  story_label: "La Nostra Storia"
  story_title: "Una passione per l'avventura e il deserto"
  story_p1: "Baroudeurs du Désert è nato da una passione: far scoprire il deserto in modo diverso."
  story_p2: "Creiamo esperienze autentiche per viaggiatori in cerca di avventura, cambiamento e incontri."
  story_p3: "Dalle dune infinite alle oasi nascoste, passando per villaggi tradizionali e paesaggi selvaggi, ogni tour è pensato per farti vivere un'avventura unica."
  story_objective: "Il nostro obiettivo?"
  story_tagline: "Portarti dove iniziano i ricordi."

  # I nostri valori
  values_subtitle: "I Nostri Valori"
  values_title: "Ciò che ci guida ogni giorno"
  values:
    authenticity:
      title: "Autenticità"
      text: "Ti facciamo scoprire il deserto, i suoi paesaggi, le tradizioni e la sua gente in modo autentico."
    adventure:
      title: "Avventura"
      text: "Escursioni, trekking e tour pensati per gli amanti della scoperta e delle esperienze uniche."
    proximity:
      title: "Vicinanza"
      text: "Un team appassionato e disponibile ad accompagnarti prima, durante e dopo il tuo viaggio."
    safety:
      title: "Sicurezza"
      text: "Partner locali esperti e tour organizzati con cura per viaggiare in tutta serenità."

  # Perché
  why_title: "Perché scegliere Baroudeurs du Désert?"
  why_item1: "Esperienze autentiche"
  why_item2: "Guide e partner locali"
  why_item3: "Tour adatti a tutti i viaggiatori"
  why_item4: "Piccoli gruppi per un'esperienza più umana"
  why_item5: "Paesaggi eccezionali"
  why_item6: "Assistenza e supporto personalizzato"

  # Emozione
  emotional_quote: "Il deserto non si visita soltanto... si sente."
  emotional_question: "Pronto a vivere la tua prossima avventura?"
  emotional_button: "Scopri i nostri tour"

blog_page:
  title: "Il Nostro Blog"
  breadcrumb_home: "Home"
  subtitle: "Consigli, Guide e Storie dal Sahara"
  posted_by: "Pubblicato da"
  view_circuits: "Vedi i Nostri Circuiti"
  article1:
    title: "Preparare lo zaino per il deserto"
    excerpt: "Prepara lo zaino in modo intelligente! I nostri bivacchi forniscono tutti i pasti (pane di sabbia, formaggio, marmellata, tè, chorba, couscous). Ti servono solo vestiti caldi per le notti fredde, un costume per le sorgenti di Ksar Ghilane, scarpe comode, crema solare e una torcia."
  article2:
    title: "Cosa vedere a Ksar Ghilane?"
    excerpt: "Scopri l'oasi più meridionale della Tunisia, situata ai margini del Grande Erg Orientale. Fai un bagno nella sua sorgente termale naturale circondata da palme, esplora le rovine romane e goditi giri in quad o a dorso di dromedario (opzionale)!"
  article3:
    title: "Le nostre ricette preferite al bivacco"
    excerpt: "Vivi la vera cucina beduina! Guarda le nostre guide cuocere il 'Pane di Sabbia' sotto il fuoco e goditi cene tradizionali di chorba, couscous e frutta di stagione sotto le stelle."

