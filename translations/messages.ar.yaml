about_page:
  title: "من نحن"
  breadcrumb_home: "الرئيسية"
  intro: "اكتشف القصة وراء مغامرو الصحراء"
  presentation_title: "قصتنا"
  presentation_text: "ولدت مغامرو الصحراء من شغف مشترك بالفضاءات الواسعة وتقاليد جنوب تونس. ما بدأ كمجموعة صغيرة من الأصدقاء يشاركون حبهم للصحراء تحول إلى فريق من المهنيين المتفانين الملتزمين بمشاركة جمال وثقافة تونس مع مسافرين من جميع أنحاء العالم."
  mission_title: "مهمتنا"
  mission_text: "تقديم تجارب صحراوية أصيلة ومسؤولة تربط المسافرين بالروح الحقيقية لتونس. نؤمن بالسفر الذي يحترم المجتمعات المحلية ويحافظ على البيئة ويخلق ذكريات دائمة."
  
  team_title: "تعرف على فريقنا"
  team_subtitle: "الأشخاص الشغوفون وراء مغامرتك الصحراوية"
  
  team:
    member1:
      name: "أحمد بن علي"
      role: "المؤسس ومرشد الصحراء"
      description: "ولد ونشأ في دوز، يستكشف أحمد الصحراء منذ أكثر من 20 عامًا. معرفته العميقة بالصحراء وشغفه بمشاركتها مع الآخرين هما قلب مغامرو الصحراء."
    member2:
      name: "محمد الخضراء"
      role: "مرشد أول"
      description: "مع 15 عامًا من الخبرة، يعرف محمد كل كثيب وواحة في الصحراء التونسية. هدوئه ومهاراته في سرد القصص يجعلان كل رحلة لا تُنسى."
    member3:
      name: "ليلى بن عمر"
      role: "مرشدة ثقافية"
      description: "تجلب ليلى تقاليد تونس إلى الحياة. معرفتها بالثقافة الأمازيغية والمطبخ المحلي والحرف التقليدية تضيف بُعدًا فريدًا لكل جولة."
    member4:
      name: "كريم المنصور"
      role: "سائق 4x4 وميكانيكي"
      description: "خبرة كريم خلف المقود ومهاراته الميكانيكية تضمن رحلات آمنة ومريحة عبر أكثر مسارات الصحراء بعدًا."
  
  values_title: "قيمنا"
  values_subtitle: "المبادئ التي توجه كل ما نقوم به"
  
  values:
    authenticity:
      title: "الأصالة"
      description: "نقدم تجارب أصيلة تعكس الثقافة الحقيقية وروح تونس. لا فخاخ سياحية، فقط اتصالات حقيقية مع الأشخاص والأماكن."
    safety:
      title: "السلامة"
      description: "سلامتك هي أولويتنا. مرشدونا محترفون مدربون، ومركباتنا محفوظة جيدًا، ونتبع بروتوكولات سلامة صارمة في كل جولة."
    respect:
      title: "احترام المجتمعات المحلية"
      description: "نعمل جنبًا إلى جنب مع المجتمعات المحلية، لضمان أن تعود السياحة بالفائدة على الناس الذين يسكنون الصحراء. نحترم تقاليدهم وطريقة حياتهم."
    sustainability:
      title: "السياحة المسؤولة"
      description: "نلتزم بحماية النظام البيئي الصحراوي الهش. نقلل من تأثيرنا البيئي، وندعم جهود الحفاظ على البيئة، ونروج لممارسات السفر المستدامة."
  
  responsible_title: "نهجنا في السياحة المسؤولة"
  responsible_text: "في مغامرو الصحراء، نؤمن بأن السفر يجب أن يفيد. يشمل نهجنا في السياحة المسؤولة:"
  responsible_items:
    item1: "العمل مع مرشدين وسائقين محليين"
    item2: "دعم الأعمال التجارية والحرفيين المحليين"
    item3: "تقليل النفايات والأثر البيئي"
    item4: "احترام الحياة البرية والموائل الطبيعية"
    item5: "تعزيز التبادل الثقافي والتفاهم"
    item6: "رد الجميل للمجتمعات المحلية"
  
  gallery_title: "معرضنا"
  gallery_subtitle: "لحظات من مغامراتنا الصحراوية"
  
  cta_title: "هل أنت مستعد لاستكشاف الصحراء؟"
  cta_text: "انضم إلينا في مغامرة لا تُنسى في الصحراء التونسية"
  cta_button: "احجز مغامرتك"


blog_page:
  title: "مدونتنا"
  breadcrumb_home: "الرئيسية"
  subtitle: "نصائح وأدلة وقصص من الصحراء"
  posted_by: "نشر بواسطة"
  view_circuits: "عرض رحلاتنا"
  article1:
    title: "تجهيز حقيبتك للصحراء"
    excerpt: "جهّز حقيبتك بذكاء! مخيماتنا توفر جميع الوجبات (خبز الرمل، الجبن، المربى، الشاي، الشوربة، الكسكس). كل ما تحتاجه هو ملابس دافئة لليالي الباردة، ملابس سباحة لليانابيع الساخنة في قصر غيلان، حذاء مريح، واقي شمس، ومصباح يدوي."
  article2:
    title: "ماذا ترى في قصر غيلان؟"
    excerpt: "اكتشف أقصى واحة في الجنوب التونسي، تقع على حافة العرق الشرقي الكبير. اسبح في ينابيعها الحرارية الطبيعية وسط النخيل، واستكشف الآثار الرومانية، واستمتع بجولات بالدراجات الرباعية أو ركوب الجمال (اختياري)!"
  article3:
    title: "وصفاتنا المفضلة في المخيم"
    excerpt: "عش تجربة المطبخ البدوي الأصيل! شاهد مرشدينا وهم يخبزون 'خبز الرمل' تحت النار، واستمتع بعشاءات تقليدية من الشوربة والكسكس والفواكه الموسمية تحت النجوم."



success_message: "تم إرسال طلبك بنجاح! سنتواصل معك في أقرب وقت ممكن."

