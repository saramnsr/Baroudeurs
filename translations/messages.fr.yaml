about_page:
  hero_label: "Qui sommes-nous ?"
  title: "Qui sommes-nous ?"
  breadcrumb_home: "Accueil"

  # Hero
  hero_title: "Qui sommes-nous ?"
  hero_subtitle: "Plus qu'un voyage, une aventure à vivre."
  hero_text: "Baroudeurs du Désert vous invite à découvrir des paysages authentiques, des horizons infinis et des expériences inoubliables au cœur du désert."
  hero_button: "Découvrir nos aventures"

  # Notre histoire
  story_label: "Notre Histoire"
  story_title: "Une passion pour l'aventure et le désert"
  story_p1: "Baroudeurs du Désert est né d'une passion : celle de faire découvrir le désert autrement."
  story_p2: "Nous créons des expériences authentiques pour les voyageurs en quête d'aventure, de dépaysement et de rencontres."
  story_p3: "Des dunes infinies aux oasis cachées, en passant par les villages traditionnels et les paysages sauvages, chaque circuit est pensé pour vous faire vivre une aventure unique."
  story_objective: "Notre objectif ?"
  story_tagline: "Vous emmener là où les souvenirs commencent."

  # Nos valeurs
  values_subtitle: "Nos valeurs"
  values_title: "Ce qui nous anime au quotidien"
  values:
    authenticity:
      title: "Authenticité"
      text: "Nous vous faisons découvrir le désert, ses paysages, ses traditions et ses habitants de manière authentique."
    adventure:
      title: "Aventure"
      text: "Excursions, treks et circuits pensés pour les amoureux de découverte et d'expériences uniques."
    proximity:
      title: "Proximité"
      text: "Une équipe passionnée et disponible pour vous accompagner avant, pendant et après votre voyage."
    safety:
      title: "Sécurité"
      text: "Des partenaires locaux expérimentés et des circuits organisés avec soin pour voyager en toute sérénité."

  # Pourquoi
  why_title: "Pourquoi choisir Baroudeurs du Désert ?"
  why_item1: "Des expériences authentiques"
  why_item2: "Des guides et partenaires locaux"
  why_item3: "Des circuits adaptés à tous les voyageurs"
  why_item4: "Des petits groupes pour une expérience plus humaine"
  why_item5: "Des paysages exceptionnels"
  why_item6: "Une assistance et un accompagnement personnalisé"

  # Émotion
  emotional_quote: "Le désert ne se visite pas seulement... il se ressent."
  emotional_question: "Prêt à vivre votre prochaine aventure ?"
  emotional_button: "Découvrir nos circuits"

blog_page:
  title: "Notre Blog"
  breadcrumb_home: "Accueil"
  subtitle: "Conseils, Guides & Histoires du Sahara"
  posted_by: "Publié par"
  view_circuits: "Voir Nos Circuits"
  article1:
    title: "Préparer votre sac pour le désert"
    excerpt: "Préparez malin ! Nos bivouacs fournissent tous les repas (pain de sable, fromage, confiture, thé, chorba, couscous). Il vous faut juste des vêtements chauds pour les nuits fraîches, un maillot de bain pour les sources de Ksar Ghilane, des chaussures confortables, de la crème solaire et une lampe de poche."
  article2:
    title: "Que voir à Ksar Ghilane ?"
    excerpt: "Découvrez l'oasis la plus méridionale de Tunisie, située aux portes du Grand Erg Oriental. Baignez-vous dans sa source thermale naturelle entourée de palmiers, explorez les ruines romaines et profitez de balades en quad ou à dos de dromadaire (en option) !"
  article3:
    title: "Nos recettes préférées en bivouac"
    excerpt: "Vivez la véritable cuisine bédouine ! Regardez nos guides cuire le 'Pain de Sable' sous le feu, et savourez des dîners traditionnels de chorba, de couscous et de fruits de saison sous les étoiles."

