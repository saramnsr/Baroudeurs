about_page:
  title: "À Propos de Nous"
  breadcrumb_home: "Accueil"
  intro: "Découvrez l'histoire derrière Les Baroudeurs du Désert"
  presentation_title: "Notre Histoire"
  presentation_text: "Les Baroudeurs du Désert est né d'une passion commune pour les grands espaces et les traditions du sud tunisien. Ce qui a commencé comme un petit groupe d'amis partageant leur amour du désert est devenu une équipe de professionnels dévoués, engagés à faire découvrir la beauté et la culture de la Tunisie aux voyageurs du monde entier."
  mission_title: "Notre Mission"
  mission_text: "Offrir des expériences authentiques et responsables dans le désert qui connectent les voyageurs avec le véritable esprit de la Tunisie. Nous croyons en un voyage qui respecte les communautés locales, préserve l'environnement et crée des souvenirs durables."
  
  team_title: "Rencontrez Notre Équipe"
  team_subtitle: "Les passionnés qui se cachent derrière votre aventure dans le désert"
  
  team:
    member1:
      name: "Ahmed Ben Ali"
      role: "Fondateur & Guide Désert"
      description: "Né et élevé à Douz, Ahmed explore le Sahara depuis plus de 20 ans. Sa connaissance profonde du désert et sa passion pour le partager avec les autres sont le cœur des Baroudeurs du Désert."
    member2:
      name: "Mohamed El Khadra"
      role: "Guide Principal"
      description: "Avec 15 ans d'expérience, Mohamed connaît chaque dune et oasis du Sahara tunisien. Son calme et ses talents de conteur rendent chaque voyage inoubliable."
    member3:
      name: "Laila Ben Amor"
      role: "Guide Culturelle"
      description: "Laila donne vie aux traditions de la Tunisie. Sa connaissance de la culture berbère, de la cuisine locale et de l'artisanat traditionnel ajoute une dimension unique à chaque circuit."
    member4:
      name: "Karim El Mansour"
      role: "Chauffeur 4x4 & Mécanicien"
      description: "L'expertise de Karim au volant et ses compétences mécaniques garantissent des voyages sûrs et confortables sur les pistes désertiques les plus reculées."
  
  values_title: "Nos Valeurs"
  values_subtitle: "Les principes qui guident tout ce que nous faisons"
  
  values:
    authenticity:
      title: "Authenticité"
      description: "Nous proposons des expériences authentiques qui reflètent la véritable culture et l'esprit de la Tunisie. Pas de pièges à touristes, juste de vraies connexions avec les personnes et les lieux."
    safety:
      title: "Sécurité"
      description: "Votre sécurité est notre priorité. Nos guides sont des professionnels formés, nos véhicules sont bien entretenus et nous suivons des protocoles de sécurité stricts lors de chaque excursion."
    respect:
      title: "Respect des Communautés Locales"
      description: "Nous travaillons main dans la main avec les communautés locales, en veillant à ce que le tourisme profite aux personnes qui habitent le désert. Nous respectons leurs traditions et leur mode de vie."
    sustainability:
      title: "Tourisme Responsable"
      description: "Nous nous engageons à protéger le fragile écosystème désertique. Nous minimisons notre impact environnemental, soutenons les efforts de conservation et promouvons des pratiques de voyage durables."
  
  responsible_title: "Notre Approche de Tourisme Responsable"
  responsible_text: "Aux Baroudeurs du Désert, nous croyons que le voyage devrait faire du bien. Notre approche de tourisme responsable comprend :"
  responsible_items:
    item1: "Travailler avec des guides et chauffeurs locaux"
    item2: "Soutenir les entreprises et artisans locaux"
    item3: "Minimiser les déchets et l'impact environnemental"
    item4: "Respecter la faune et les habitats naturels"
    item5: "Promouvoir les échanges culturels et la compréhension"
    item6: "Redonner aux communautés locales"
  
  gallery_title: "Notre Galerie"
  gallery_subtitle: "Des moments de nos aventures dans le désert"
  
  cta_title: "Prêt à Explorer le Désert ?"
  cta_text: "Rejoignez-nous pour une aventure inoubliable dans le Sahara tunisien"
  cta_button: "Réservez Votre Aventure"

blog_page:
  title: "Notre Blog"
  breadcrumb_home: "Accueil"
  subtitle: "Conseils, Guides & Histoires du Sahara"
  posted_by: "Publié par"
  view_circuits: "Voir Nos Circuits"
  article1:
    title: "Préparer votre sac pour le désert"
    excerpt: "Préparez malin ! Nos bivouacs fournissent tous les repas (pain de sable, fromage, confiture, thé, chorba, couscous). Il vous faut juste des vêtements chauds pour les nuits fraîches, un maillot de bain pour les sources de Ksar Ghilane, des chaussures confortables, de la crème solaire et une lampe de poche."
  article2:
    title: "Que voir à Ksar Ghilane ?"
    excerpt: "Découvrez l'oasis la plus méridionale de Tunisie, située aux portes du Grand Erg Oriental. Baignez-vous dans sa source thermale naturelle entourée de palmiers, explorez les ruines romaines et profitez de balades en quad ou à dos de dromadaire (en option) !"
  article3:
    title: "Nos recettes préférées en bivouac"
    excerpt: "Vivez la véritable cuisine bédouine ! Regardez nos guides cuire le 'Pain de Sable' sous le feu, et savourez des dîners traditionnels de chorba, de couscous et de fruits de saison sous les étoiles."

