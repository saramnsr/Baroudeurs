about_page:
  title: "About Us"
  breadcrumb_home: "Home"
  intro: "Discover the story behind Les Baroudeurs du Désert"
  presentation_title: "Our Story"
  presentation_text: "Les Baroudeurs du Désert was born from a common passion for the wide open spaces and traditions of southern Tunisia. What started as a small group of friends sharing their love for the desert has grown into a team of dedicated professionals committed to sharing the beauty and culture of Tunisia with travelers from around the world."
  mission_title: "Our Mission"
  mission_text: "To offer authentic and responsible desert experiences that connect travelers with the true spirit of Tunisia. We believe in travel that respects local communities, preserves the environment, and creates lasting memories."
  
  team_title: "Meet Our Team"
  team_subtitle: "The passionate people behind your desert adventure"
  
  team:
    member1:
      name: "Ahmed Ben Ali"
      role: "Founder & Desert Guide"
      description: "Born and raised in Douz, Ahmed has been exploring the Sahara for over 20 years. His deep knowledge of the desert and his passion for sharing it with others is the heart of Les Baroudeurs du Désert."
    member2:
      name: "Mohamed El Khadra"
      role: "Senior Guide"
      description: "With 15 years of experience, Mohamed knows every dune and oasis of the Tunisian Sahara. His calm demeanor and storytelling skills make every journey unforgettable."
    member3:
      name: "Laila Ben Amor"
      role: "Cultural Guide"
      description: "Laila brings the traditions of Tunisia to life. Her knowledge of Berber culture, local cuisine, and traditional crafts adds a unique dimension to every tour."
    member4:
      name: "Karim El Mansour"
      role: "4x4 Driver & Mechanic"
      description: "Karim's expertise behind the wheel and his mechanical skills ensure safe and comfortable journeys across the most remote desert tracks."
  
  values_title: "Our Values"
  values_subtitle: "The principles that guide everything we do"
  
  values:
    authenticity:
      title: "Authenticity"
      description: "We offer genuine experiences that reflect the true culture and spirit of Tunisia. No tourist traps, just real connections with people and places."
    safety:
      title: "Safety"
      description: "Your safety is our priority. Our guides are trained professionals, our vehicles are well-maintained, and we follow strict safety protocols on every tour."
    respect:
      title: "Respect for Local Communities"
      description: "We work hand in hand with local communities, ensuring that tourism benefits the people who call the desert home. We respect their traditions and way of life."
    sustainability:
      title: "Responsible Tourism"
      description: "We are committed to protecting the fragile desert ecosystem. We minimize our environmental impact, support conservation efforts, and promote sustainable travel practices."
  
  responsible_title: "Our Responsible Tourism Approach"
  responsible_text: "At Les Baroudeurs du Désert, we believe that travel should do good. Our responsible tourism approach includes:"
  responsible_items:
    item1: "Working with local guides and drivers"
    item2: "Supporting local businesses and artisans"
    item3: "Minimizing waste and environmental impact"
    item4: "Respecting wildlife and natural habitats"
    item5: "Promoting cultural exchange and understanding"
    item6: "Giving back to local communities"
  
  gallery_title: "Our Gallery"
  gallery_subtitle: "Moments from our desert adventures"
  
  cta_title: "Ready to Explore the Desert?"
  cta_text: "Join us for an unforgettable adventure in the Tunisian Sahara"
  cta_button: "Book Your Adventure"

blog_page:
  title: "Our Blog"
  breadcrumb_home: "Home"
  subtitle: "Tips, Guides & Stories from the Sahara"
  posted_by: "Posted by"
  view_circuits: "View Our Circuits"
  article1:
    title: "Preparing your bag for the desert"
    excerpt: "Pack smart! Our bivouacs provide all meals (sand bread, cheese, jam, tea, chorba, couscous). You just need warm clothes for cold nights, a swimsuit for Ksar Ghilane hot springs, comfy shoes, sunscreen, and a flashlight."
  article2:
    title: "What to see in Ksar Ghilane?"
    excerpt: "Discover the southernmost oasis in Tunisia, located at the edge of the Grand Erg Oriental. Swim in its natural hot spring surrounded by palm trees, explore the Roman ruins, and enjoy optional quad or camel rides!"
  article3:
    title: "Our favorite recipes in bivouac"
    excerpt: "Experience true Bedouin cuisine! Watch our guides bake 'Pain de Sable' (sand bread) under the fire, and enjoy traditional dinners of Chorba soup, couscous, and seasonal fruits under the stars."

