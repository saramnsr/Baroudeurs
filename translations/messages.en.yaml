blog_page:
  title: "Our Blog"
  breadcrumb_home: "Home"
  subtitle: "Tips, Guides & Stories from the Sahara"
  posted_by: "Posted by"
  view_circuits: "View Our Circuits"
  article1:
    title: "Preparing your bag for the desert"
    excerpt: "Pack smart! Our bivouacs provide all meals (sand bread, cheese, jam, tea, chorba, couscous). You just need warm clothes for cold nights, a swimsuit for Ksar Ghilane hot springs, comfy shoes, sunscreen, and a flashlight."
  article2:
    title: "What to see in Ksar Ghilane?"
    excerpt: "Discover the southernmost oasis in Tunisia, located at the edge of the Grand Erg Oriental. Swim in its natural hot spring surrounded by palm trees, explore the Roman ruins, and enjoy optional quad or camel rides!"
  article3:
    title: "Our favorite recipes in bivouac"
    excerpt: "Experience true Bedouin cuisine! Watch our guides bake 'Pain de Sable' (sand bread) under the fire, and enjoy traditional dinners of Chorba soup, couscous, and seasonal fruits under the stars."

