    playground_note: "Southern Tunisia, our playground"

    services_label: "OUR SERVICES"
    services_title: "Tailor-made services, for a unique experience."

    service1_title: "4x4 CIRCUITS"
    service1_subtitle: "The life-size desert"
    service1_text: "Discover the dunes, oases, forgotten tracks and wild landscapes of southern Tunisia aboard our 4x4s."

    service2_title: "TREKS & HIKES"
    service2_subtitle: "Walking to the rhythm of the desert"
    service2_text: "Itineraries to discover the Sahara in a different way: hiking, trekking and immersion in the landscapes of the Grand Erg Oriental."
