about_page:
  hero_label: "About Us"
  title: "About Us"
  breadcrumb_home: "Home"

  # Hero
  hero_title: "About Us"
  hero_subtitle: "More than a trip, an adventure to live."
  hero_text: "Baroudeurs du Désert invites you to discover authentic landscapes, endless horizons and unforgettable experiences in the heart of the desert."
  hero_button: "Discover our adventures"

  # Our Story
  story_label: "Our Story"
  story_title: "A passion for adventure and the desert"
  story_p1: "Baroudeurs du Désert was born from a passion: showing the desert differently."
  story_p2: "We create authentic experiences for travelers seeking adventure, change of scenery and encounters."
  story_p3: "From endless dunes to hidden oases, through traditional villages and wild landscapes, every tour is designed to let you live a unique adventure."
  story_objective: "Our goal?"
  story_tagline: "Take you where memories begin."

  # Values
  values_subtitle: "Our Values"
  values_title: "What drives us every day"
  values:
    authenticity:
      title: "Authenticity"
      text: "We let you discover the desert, its landscapes, traditions and people in an authentic way."
    adventure:
      title: "Adventure"
      text: "Excursions, treks and tours designed for lovers of discovery and unique experiences."
    proximity:
      title: "Proximity"
      text: "A passionate team available to accompany you before, during and after your trip."
    safety:
      title: "Safety"
      text: "Experienced local partners and carefully organized tours to travel with peace of mind."

  # Why
  why_title: "Why choose Baroudeurs du Désert?"
